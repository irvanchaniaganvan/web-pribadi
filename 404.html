<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Halaman tidak ditemukan — Irvan Chaniagan Portfolio.">
  <title>404 — Halaman Tidak Ditemukan</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .not-found {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 28px;
    }

    .not-found-code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(6rem, 20vw, 12rem);
      line-height: 1;
      color: var(--line);
      margin: 0;
    }

    .not-found h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      margin: 16px 0 12px;
    }

    .not-found p {
      color: var(--muted);
      max-width: 400px;
      line-height: 1.8;
      margin: 0 0 36px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Navigasi utama">
      <a class="brand" href="index.html">IC<span>.</span></a>
      <div class="nav-menu" style="margin:auto">
        <a class="nav-link" href="index.html">Beranda</a>
        <a class="nav-link" href="pages/about.html">Tentang</a>
        <a class="nav-link" href="pages/portofolio.html">Proyek</a>
        <a class="nav-link" href="pages/contact.html">Kontak</a>
      </div>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Ganti tema">☼</button>
      </div>
    </nav>
  </header>

  <main>
    <div class="not-found">
      <p class="not-found-code">404</p>
      <h1>Halaman tidak ditemukan.</h1>
      <p>Sepertinya halaman yang kamu cari tidak ada atau sudah dipindahkan.</p>
      <a class="button button-primary" href="index.html">← Kembali ke beranda</a>
    </div>
  </main>

  <footer class="site-footer">
    <p>© <span class="current-year"></span> Irvan Chaniagan</p>
  </footer>

  <script>
    if (localStorage.getItem('portfolio-theme') === 'dark') document.body.classList.add('dark');
    document.querySelector('.theme-toggle')?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('portfolio-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    });
    document.querySelectorAll('.current-year').forEach(el => el.textContent = new Date().getFullYear());
  </script>
</body>
</html>
